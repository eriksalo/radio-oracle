# /etc/NetworkManager/conf.d/zz-wifi-powersave-off.conf
#
# The Orin Nano dev kit's RTL8822CE (rtl88x2ce) drops off the network with
# 802.11 power saving on; JetPack's default-wifi-powersave-on.conf enables it
# (3). This file sorts after it and turns it off (2). Also set it on the
# connection profile, which overrides both:
#
#   sudo cp systemd/wifi-powersave-off.conf /etc/NetworkManager/conf.d/zz-wifi-powersave-off.conf
#   sudo nmcli con modify "<SSID>" 802-11-wireless.powersave 2
#   sudo iw dev wlP1p1s0 set power_save off      # live, no reconnect
#   iw dev wlP1p1s0 get power_save               # → Power save: off
[connection]
wifi.powersave = 2
