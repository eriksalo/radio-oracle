# /etc/systemd/journald.conf.d/radio-oracle.conf
#
# Keep the journal across reboots. JetPack ships with Storage=auto and no
# /var/log/journal, so every boot wiped the previous boot's logs — when the
# radio went dark for three weeks in Oct 2026 there was nothing to read.
# 200 MB on the NVMe is ~2 weeks of logs with the diag access log off.
#
#   sudo mkdir -p /etc/systemd/journald.conf.d /var/log/journal
#   sudo cp systemd/journald-radio-oracle.conf /etc/systemd/journald.conf.d/radio-oracle.conf
#   sudo systemd-tmpfiles --create --prefix /var/log/journal
#   sudo systemctl restart systemd-journald
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemMaxFileSize=20M
Compress=yes
